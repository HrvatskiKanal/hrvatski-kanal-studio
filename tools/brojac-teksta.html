<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brojač teksta</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Brojač teksta</span>
    </div>
    <div class="tool-body">
      <h1>Brojač teksta</h1>
      <p>Provjeri broj znakova, riječi i rečenica.</p>

      <div class="tool-box">
        <textarea id="textInput" placeholder="Upiši tekst ovdje..."></textarea>
        <div class="row">
          <button id="countBtn" class="btn btn-primary" type="button">Izračunaj</button>
        </div>
        <div class="row" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));">
          <div class="panel" style="padding:12px; border-radius:12px;">
            <div class="label" style="font-size:0.72rem;">Riječi</div>
            <div id="wordCount" style="font-size:1.8rem; font-weight:800;">0</div>
          </div>
          <div class="panel" style="padding:12px; border-radius:12px;">
            <div class="label" style="font-size:0.72rem;">Znakovi</div>
            <div id="charCount" style="font-size:1.8rem; font-weight:800;">0</div>
          </div>
          <div class="panel" style="padding:12px; border-radius:12px;">
            <div class="label" style="font-size:0.72rem;">Rečenice</div>
            <div id="sentenceCount" style="font-size:1.8rem; font-weight:800;">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const countBtn = document.getElementById('countBtn');

    function updateCounts() {
      const text = textInput.value.trim();
      const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
      const chars = text.length;
      const sentences = text ? text.split(/[.!?]+/).filter(Boolean).length : 0;

      document.getElementById('wordCount').textContent = words;
      document.getElementById('charCount').textContent = chars;
      document.getElementById('sentenceCount').textContent = sentences;
    }

    countBtn.addEventListener('click', updateCounts);
    textInput.addEventListener('input', updateCounts);
  </script>
</body>
</html>
