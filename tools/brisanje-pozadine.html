<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brisanje pozadine</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .tool-controls {
      display: grid;
      gap: 14px;
    }
    .canvas-wrap {
      margin-top: 16px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(148,163,184,0.2);
      background: linear-gradient(45deg, #e2e8f0 25%, transparent 25%, transparent 75%, #e2e8f0 75%, #e2e8f0),
                  linear-gradient(45deg, #e2e8f0 25%, transparent 25%, transparent 75%, #e2e8f0 75%, #e2e8f0);
      background-size: 20px 20px;
      background-color: #cbd5e1;
      background-position: 0 0, 10px 10px;
      min-height: 320px;
      display: grid;
      place-items: center;
    }
    canvas {
      max-width: 100%;
      max-height: 420px;
      display: block;
      border-radius: 12px;
    }
    input[type="color"] {
      width: 52px;
      height: 42px;
      padding: 0;
      border: none;
      background: transparent;
      border-radius: 8px;
    }
    .small-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .color-swatch {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag na alatni katalog</a>
      <span>Brisanje pozadine</span>
    </div>
    <div class="tool-body">
      <h1>Brisanje pozadine</h1>
      <p>Ukloni pozadinu s fotografije lokalno u browseru i spremi rezultat kao PNG.</p>

      <div class="tool-box tool-controls">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/*" />
          Učitaj sliku
        </label>

        <div class="small-row">
          <label for="bgMode">Pozadina:</label>
          <select id="bgMode">
            <option value="transparent">Prozirno</option>
            <option value="white">Bijelo</option>
            <option value="black">Crno</option>
            <option value="gradient">Gradijent</option>
            <option value="custom">Prilagođena</option>
          </select>
          <input id="customColor" type="color" value="#ffffff" />
        </div>

        <div class="small-row">
          <button id="processBtn" class="btn btn-primary" type="button">Obriši pozadinu</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas" width="900" height="500"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const bgMode = document.getElementById('bgMode');
    const customColor = document.getElementById('customColor');

    let currentImage = null;

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          drawPreview();
          processBtn.disabled = false;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawPreview() {
      if (!currentImage) return;
      const maxWidth = 900;
      const maxHeight = 500;
      const ratio = Math.min(maxWidth / currentImage.width, maxHeight / currentImage.height, 1);
      canvas.width = Math.max(200, currentImage.width * ratio);
      canvas.height = Math.max(200, currentImage.height * ratio);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
    }

    function estimateBackground(data, width, height) {
      const samples = [
        [0, 0], [width - 1, 0], [0, height - 1], [width - 1, height - 1],
        [Math.floor(width / 2), 0], [Math.floor(width / 2), height - 1],
        [0, Math.floor(height / 2)], [width - 1, Math.floor(height / 2)]
      ].map(([x, y]) => {
        const idx = (y * width + x) * 4;
        return [data[idx], data[idx + 1], data[idx + 2]];
      });
      const sum = [0, 0, 0];
      samples.forEach(([r, g, b]) => {
        sum[0] += r; sum[1] += g; sum[2] += b;
      });
      return sum.map(v => v / samples.length);
    }

    function removeBackground(img) {
      const temp = document.createElement('canvas');
      temp.width = img.width;
      temp.height = img.height;
      const tctx = temp.getContext('2d');
      tctx.drawImage(img, 0, 0);
      const imageData = tctx.getImageData(0, 0, temp.width, temp.height);
      const data = imageData.data;
      const bg = estimateBackground(data, temp.width, temp.height);

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const sat = Math.max(r, g, b) - Math.min(r, g, b);
        const dist = Math.sqrt((r - bg[0]) ** 2 + (g - bg[1]) ** 2 + (b - bg[2]) ** 2);
        if (dist < 30 && sat < 40) {
          data[i + 3] = 0;
        }
      }

      tctx.putImageData(imageData, 0, 0);
      return temp;
    }

    function fillBackground(sourceCanvas) {
      const output = document.createElement('canvas');
      output.width = sourceCanvas.width;
      output.height = sourceCanvas.height;
      const octx = output.getContext('2d');

      const mode = bgMode.value;
      if (mode === 'transparent') {
        const size = 18;
        for (let y = 0; y < output.height; y += size) {
          for (let x = 0; x < output.width; x += size) {
            octx.fillStyle = ((x / size + y / size) % 2 === 0) ? '#f1f5f9' : '#e2e8f0';
            octx.fillRect(x, y, size, size);
          }
        }
      } else if (mode === 'white') {
        octx.fillStyle = '#ffffff';
        octx.fillRect(0, 0, output.width, output.height);
      } else if (mode === 'black') {
        octx.fillStyle = '#000000';
        octx.fillRect(0, 0, output.width, output.height);
      } else if (mode === 'gradient') {
        const grad = octx.createLinearGradient(0, 0, output.width, output.height);
        grad.addColorStop(0, '#60a5fa');
        grad.addColorStop(1, '#8b5cf6');
        octx.fillStyle = grad;
        octx.fillRect(0, 0, output.width, output.height);
      } else {
        octx.fillStyle = customColor.value;
        octx.fillRect(0, 0, output.width, output.height);
      }

      octx.drawImage(sourceCanvas, 0, 0);
      return output;
    }

    processBtn.addEventListener('click', () => {
      if (!currentImage) return;
      const cleaned = removeBackground(currentImage);
      const finalCanvas = fillBackground(cleaned);

      const maxWidth = 900;
      const maxHeight = 500;
      const ratio = Math.min(maxWidth / finalCanvas.width, maxHeight / finalCanvas.height, 1);
      canvas.width = Math.max(200, finalCanvas.width * ratio);
      canvas.height = Math.max(200, finalCanvas.height * ratio);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(finalCanvas, 0, 0, canvas.width, canvas.height);
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentImage) return;
      const link = document.createElement('a');
      link.download = 'bez-pozadine.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
