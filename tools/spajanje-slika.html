<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spajanje slika</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .canvas-wrap { display: flex; justify-content: center; margin-top: 18px; overflow-x: auto; }
    canvas { max-width: 100%; border-radius: 16px; background: #0b1120; }
    .status { min-height: 1.4em; margin-top: 12px; color: var(--muted); }
    .status.error { color: #fecaca; }
  </style>
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Spajanje slika</span>
    </div>
    <div class="tool-body">
      <h1>Spajanje slika</h1>
      <p>Učitaj 2–4 slike i spoji ih u kolaž. Slike ostaju u odabranom redoslijedu.</p>

      <div class="tool-box">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple />
          Učitaj slike
        </label>
        <div id="status" class="status" role="status" aria-live="polite">Odaberi od 2 do 4 slike.</div>
        <div class="row">
          <button id="mergeBtn" class="btn btn-primary" type="button" disabled>Spoji</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas" width="800" height="600" aria-label="Pregled kolaža"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const mergeBtn = document.getElementById('mergeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const status = document.getElementById('status');
    let images = [];

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error(`${file.name} nije podržana slika.`));
        };
        image.src = objectUrl;
      });
    }

    fileInput.addEventListener('change', async () => {
      const files = Array.from(fileInput.files || []);
      images = [];
      mergeBtn.disabled = true;
      downloadBtn.disabled = true;
      if (files.length < 2 || files.length > 4) {
        setStatus('Odaberi najmanje 2, a najviše 4 slike.', true);
        return;
      }
      setStatus('Učitavam slike…');
      try {
        images = await Promise.all(files.map(loadImage));
        mergeBtn.disabled = false;
        setStatus(`${images.length} slike su spremne; redoslijed je isti kao u odabiru.`);
      } catch (error) {
        images = [];
        setStatus(error.message || 'Slike se ne mogu učitati.', true);
      }
    });

    mergeBtn.addEventListener('click', () => {
      if (images.length < 2) return;
      const columns = images.length === 2 ? 2 : 2;
      const rows = Math.ceil(images.length / columns);
      const cellWidth = 720;
      const cellHeight = 520;
      const padding = 24;
      canvas.width = columns * cellWidth;
      canvas.height = rows * cellHeight;
      context.fillStyle = '#0b1120';
      context.fillRect(0, 0, canvas.width, canvas.height);

      images.forEach((image, index) => {
        const x = (index % columns) * cellWidth;
        const y = Math.floor(index / columns) * cellHeight;
        const maxWidth = cellWidth - padding * 2;
        const maxHeight = cellHeight - padding * 2;
        const scale = Math.min(maxWidth / image.naturalWidth, maxHeight / image.naturalHeight);
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        context.drawImage(image, x + (cellWidth - width) / 2, y + (cellHeight - height) / 2, width, height);
      });

      downloadBtn.disabled = false;
      setStatus('Kolaž je spreman za preuzimanje.');
    });

    downloadBtn.addEventListener('click', () => {
      canvas.toBlob(blob => {
        if (!blob) {
          setStatus('Kolaž se ne može pripremiti za preuzimanje.', true);
          return;
        }
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = 'kolaz.png';
        link.href = url;
        link.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, 'image/png');
    });
  </script>
</body>
</html>
