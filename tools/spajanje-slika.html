<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spajanje slika</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .canvas-wrap { display: flex; justify-content: center; margin-top: 18px; overflow-x: auto; }
    canvas { max-width: 100%; border-radius: 16px; background: #0b1120; }
  </style>
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Spajanje slika</span>
    </div>
    <div class="tool-body">
      <h1>Spajanje slika</h1>
      <p>Učitaj 2–4 slike i spoji ih u kolaž.</p>

      <div class="tool-box">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/*" multiple />
          Učitaj slike
        </label>
        <div class="row">
          <button id="mergeBtn" class="btn btn-primary" type="button">Spoji</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const mergeBtn = document.getElementById('mergeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let images = [];

    fileInput.addEventListener('change', (event) => {
      images = [];
      const files = Array.from(event.target.files || []);
      if (files.length === 0) return;

      let loadedCount = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            images.push(img);
            loadedCount += 1;
            if (loadedCount === files.length) {
              mergeBtn.disabled = false;
            }
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    });

    mergeBtn.addEventListener('click', () => {
      if (images.length === 0) return;
      const cols = Math.min(2, images.length);
      const rows = Math.ceil(images.length / cols);
      canvas.width = cols * 360;
      canvas.height = rows * 260;
      ctx.fillStyle = '#0b1120';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      images.forEach((img, index) => {
        const x = (index % cols) * 360;
        const y = Math.floor(index / cols) * 260;
        const ratio = Math.min(320 / img.width, 220 / img.height);
        const w = img.width * ratio;
        const h = img.height * ratio;
        const centerX = x + 20 + (320 - w) / 2;
        const centerY = y + 20 + (220 - h) / 2;
        ctx.drawImage(img, centerX, centerY, w, h);
      });

      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'kolaž.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
