<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konverter slika</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .tool-layout { display: grid; gap: 14px; }
    .preview-box { min-height: 260px; display: grid; place-items: center; border: 1px solid rgba(148,163,184,0.2); border-radius: 16px; overflow: hidden; background: rgba(148,163,184,0.04); }
    .preview-box img { max-width: 100%; max-height: 360px; display: block; border-radius: 12px; }
  </style>
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Konverter slika</span>
    </div>
    <div class="tool-body">
      <h1>Konverter slika</h1>
      <p>Pretvori sliku između PNG, JPG i WebP formata.</p>

      <div class="tool-box tool-layout">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
          Učitaj sliku
        </label>
        <div class="row">
          <button class="btn btn-secondary format-btn active" data-format="image/png" type="button">PNG</button>
          <button class="btn btn-secondary format-btn" data-format="image/jpeg" type="button">JPG</button>
          <button class="btn btn-secondary format-btn" data-format="image/webp" type="button">WebP</button>
        </div>
        <div class="row">
          <button id="convertBtn" class="btn btn-primary" type="button">Konvertiraj</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="preview-box"><img id="previewImg" alt="Preview" style="display:none;" /></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewImg = document.getElementById('previewImg');
    let selectedFormat = 'image/png';
    let sourceImage = null;
    let convertedDataUrl = '';

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          convertedDataUrl = '';
          previewImg.src = e.target.result;
          previewImg.style.display = 'block';
          downloadBtn.disabled = true;
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    document.querySelectorAll('.format-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.format-btn').forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        selectedFormat = button.dataset.format;
        convertedDataUrl = '';
        downloadBtn.disabled = true;
      });
    });

    convertBtn.addEventListener('click', () => {
      if (!sourceImage) return;
      const canvas = document.createElement('canvas');
      canvas.width = sourceImage.width;
      canvas.height = sourceImage.height;
      const ctx = canvas.getContext('2d');
      if (selectedFormat === 'image/jpeg') {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }
      ctx.drawImage(sourceImage, 0, 0);
      convertedDataUrl = canvas.toDataURL(selectedFormat);
      previewImg.src = convertedDataUrl;
      previewImg.style.display = 'block';
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      if (!convertedDataUrl) return;
      const a = document.createElement('a');
      a.href = convertedDataUrl;
      a.download = 'pretvoreno.' + selectedFormat.split('/')[1];
      a.click();
    });
  </script>
</body>
</html>
