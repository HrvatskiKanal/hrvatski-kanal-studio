<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimizacija slika</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .preview-image { max-width: 100%; max-height: 360px; display: block; border-radius: 12px; }
    .info-row { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 10px; padding: 8px; border-radius: 8px; background: rgba(96, 165, 250, 0.05); }
    .info-label { font-weight: 600; color: #93c5fd; }
    .info-value { color: var(--text); }
  </style>
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Optimizacija slika</span>
    </div>
    <div class="tool-body">
      <h1>Optimizacija slika</h1>
      <p>Smanji veličinu slike bez velikeg gubitka kvalitete.</p>

      <div class="tool-box">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/*" />
          Učitaj sliku
        </label>

        <div class="row">
          <label>Maksimalna širina (px):</label>
          <input id="widthInput" type="number" value="1200" min="100" max="3000" />
        </div>
        <div class="row">
          <label>Kvaliteta:</label>
          <div style="width:100%; display:flex; gap:10px; align-items:center;">
            <input id="qualityInput" type="range" min="0.1" max="1" step="0.1" value="0.8" style="flex:1;" />
            <span id="qualityValue" style="min-width:40px; font-weight:600;">80%</span>
          </div>
        </div>
        <div class="row">
          <button id="optimizeBtn" class="btn btn-primary" type="button">Optimiziraj</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="tool-box" style="margin-top:16px;">
        <div id="infoBox" style="display:none;">
          <div class="info-row">
            <span class="info-label">Originalna veličina:</span>
            <span class="info-value" id="origSize">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Nova veličina:</span>
            <span class="info-value" id="newSize">-</span>
          </div>
          <div class="info-row">
            <span class="info-label">Redukcija:</span>
            <span class="info-value" id="reduction">-</span>
          </div>
        </div>
        <img id="previewImage" class="preview-image" alt="Optimizirana slika" style="display:none;" />
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const widthInput = document.getElementById('widthInput');
    const qualityInput = document.getElementById('qualityInput');
    const qualityValue = document.getElementById('qualityValue');
    const optimizeBtn = document.getElementById('optimizeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewImage = document.getElementById('previewImage');
    const infoBox = document.getElementById('infoBox');
    let currentImage = null;
    let originalSize = 0;

    qualityInput.addEventListener('input', () => {
      qualityValue.textContent = Math.round(qualityInput.value * 100) + '%';
    });

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(2) + ' ' + sizes[i];
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      originalSize = file.size;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          currentImage = img;
          previewImage.src = e.target.result;
          previewImage.style.display = 'block';
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    optimizeBtn.addEventListener('click', () => {
      if (!currentImage) return;
      const canvas = document.createElement('canvas');
      const ratio = currentImage.width / currentImage.height;
      const newWidth = Number(widthInput.value) || 1200;
      canvas.width = newWidth;
      canvas.height = Math.round(canvas.width / ratio);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(currentImage, 0, 0, canvas.width, canvas.height);
      const quality = Number(qualityInput.value);
      const dataUrl = canvas.toDataURL('image/jpeg', quality);
      const optimizedBytes = Math.round((dataUrl.length * 3) / 4);

      previewImage.src = dataUrl;
      previewImage.style.display = 'block';
      document.getElementById('origSize').textContent = formatFileSize(originalSize);
      document.getElementById('newSize').textContent = formatFileSize(optimizedBytes);
      const reduction = originalSize ? ((1 - optimizedBytes / originalSize) * 100).toFixed(1) : '0.0';
      document.getElementById('reduction').textContent = reduction + '%';
      infoBox.style.display = 'block';
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      if (!previewImage.src) return;
      const a = document.createElement('a');
      a.download = 'optimizirana-slika.jpg';
      a.href = previewImage.src;
      a.click();
    });
  </script>
</body>
</html>
