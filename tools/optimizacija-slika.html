<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimizacija slika</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .preview-image { max-width: 100%; max-height: 360px; display: block; border-radius: 12px; }
    .info-row { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 10px; padding: 8px; border-radius: 8px; background: rgba(96, 165, 250, 0.05); }
    .info-label { font-weight: 600; color: #93c5fd; }
    .info-value { color: var(--text); }
    .status { min-height: 1.4em; margin-top: 12px; color: var(--muted); }
    .status.error { color: #fecaca; }
  </style>
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Optimizacija slika</span>
    </div>
    <div class="tool-body">
      <h1>Optimizacija slika</h1>
      <p>Smanji dimenzije i veličinu slike lokalno u pregledniku. Manje slike se neće povećavati.</p>

      <div class="tool-box">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" />
          Učitaj sliku
        </label>
        <div id="status" class="status" role="status" aria-live="polite">Odaberi sliku.</div>

        <div class="row">
          <label for="widthInput">Maksimalna širina (px):</label>
          <input id="widthInput" type="number" value="1200" min="100" max="6000" />
        </div>
        <div class="row">
          <label for="formatInput">Izlazni format:</label>
          <select id="formatInput">
            <option value="image/webp">WebP — manja datoteka, čuva prozirnost</option>
            <option value="image/jpeg">JPG — kompatibilniji format</option>
            <option value="image/png">PNG — bez gubitka, obično veća datoteka</option>
          </select>
        </div>
        <div class="row">
          <label for="qualityInput">Kvaliteta:</label>
          <div style="width:100%; display:flex; gap:10px; align-items:center;">
            <input id="qualityInput" type="range" min="0.1" max="1" step="0.05" value="0.8" style="flex:1;" />
            <span id="qualityValue" style="min-width:40px; font-weight:600;">80%</span>
          </div>
        </div>
        <div class="row">
          <button id="optimizeBtn" class="btn btn-primary" type="button" disabled>Optimiziraj</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="tool-box" style="margin-top:16px;">
        <div id="infoBox" hidden>
          <div class="info-row"><span class="info-label">Originalna veličina:</span><span class="info-value" id="origSize">-</span></div>
          <div class="info-row"><span class="info-label">Nova veličina:</span><span class="info-value" id="newSize">-</span></div>
          <div class="info-row"><span class="info-label">Rezolucija:</span><span class="info-value" id="dimensions">-</span></div>
          <div class="info-row"><span class="info-label">Promjena veličine:</span><span class="info-value" id="reduction">-</span></div>
        </div>
        <img id="previewImage" class="preview-image" alt="Optimizirana slika" hidden />
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const widthInput = document.getElementById('widthInput');
    const qualityInput = document.getElementById('qualityInput');
    const qualityValue = document.getElementById('qualityValue');
    const formatInput = document.getElementById('formatInput');
    const optimizeBtn = document.getElementById('optimizeBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const previewImage = document.getElementById('previewImage');
    const infoBox = document.getElementById('infoBox');
    const status = document.getElementById('status');
    let sourceImage = null;
    let originalSize = 0;
    let resultBlob = null;
    let resultUrl = '';

    function formatFileSize(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const index = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
      return `${(bytes / 1024 ** index).toFixed(index ? 2 : 0)} ${units[index]}`;
    }

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function revokeResultUrl() {
      if (resultUrl) URL.revokeObjectURL(resultUrl);
      resultUrl = '';
    }

    qualityInput.addEventListener('input', () => {
      qualityValue.textContent = `${Math.round(Number(qualityInput.value) * 100)}%`;
    });

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      revokeResultUrl();
      resultBlob = null;
      downloadBtn.disabled = true;
      infoBox.hidden = true;
      previewImage.hidden = true;
      if (!file) {
        sourceImage = null;
        optimizeBtn.disabled = true;
        setStatus('Odaberi sliku.');
        return;
      }
      originalSize = file.size;
      const objectUrl = URL.createObjectURL(file);
      const image = new Image();
      image.onload = () => {
        URL.revokeObjectURL(objectUrl);
        sourceImage = image;
        optimizeBtn.disabled = false;
        setStatus(`Učitana je slika ${image.naturalWidth} × ${image.naturalHeight} px.`);
      };
      image.onerror = () => {
        URL.revokeObjectURL(objectUrl);
        sourceImage = null;
        optimizeBtn.disabled = true;
        setStatus('Odabrana datoteka nije podržana slika.', true);
      };
      image.src = objectUrl;
    });

    optimizeBtn.addEventListener('click', () => {
      if (!sourceImage) return;
      const requestedWidth = Math.max(100, Math.min(6000, Number(widthInput.value) || 1200));
      const targetWidth = Math.min(requestedWidth, sourceImage.naturalWidth);
      const targetHeight = Math.max(1, Math.round(sourceImage.naturalHeight * targetWidth / sourceImage.naturalWidth));
      const canvas = document.createElement('canvas');
      canvas.width = targetWidth;
      canvas.height = targetHeight;
      const context = canvas.getContext('2d');
      const mimeType = formatInput.value;
      if (mimeType === 'image/jpeg') {
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, targetWidth, targetHeight);
      }
      context.drawImage(sourceImage, 0, 0, targetWidth, targetHeight);
      setStatus('Pripremam optimiziranu sliku…');
      canvas.toBlob(blob => {
        if (!blob) {
          setStatus('Preglednik ne podržava odabrani izlazni format.', true);
          return;
        }
        revokeResultUrl();
        resultBlob = blob;
        resultUrl = URL.createObjectURL(blob);
        previewImage.src = resultUrl;
        previewImage.hidden = false;
        document.getElementById('origSize').textContent = formatFileSize(originalSize);
        document.getElementById('newSize').textContent = formatFileSize(blob.size);
        document.getElementById('dimensions').textContent = `${targetWidth} × ${targetHeight} px`;
        const change = originalSize ? ((1 - blob.size / originalSize) * 100).toFixed(1) : '0.0';
        document.getElementById('reduction').textContent = `${change}%`;
        infoBox.hidden = false;
        downloadBtn.disabled = false;
        setStatus('Optimizirana slika je spremna.');
      }, mimeType, Number(qualityInput.value));
    });

    downloadBtn.addEventListener('click', () => {
      if (!resultBlob) return;
      const extension = ({ 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/png': 'png' })[resultBlob.type] || 'png';
      const url = URL.createObjectURL(resultBlob);
      const link = document.createElement('a');
      link.download = `optimizirana-slika.${extension}`;
      link.href = url;
      link.click();
      window.setTimeout(() => URL.revokeObjectURL(url), 1000);
    });
  </script>
</body>
</html>
