<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vodeni žig</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Vodeni žig</span>
    </div>
    <div class="tool-body">
      <h1>Vodeni žig</h1>
      <p>Dodaj tekst u sredini slike kao vodeni žig.</p>

      <div class="tool-box">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/*" />
          Učitaj sliku
        </label>
        <div class="row">
          <input id="watermarkText" type="text" value="Hrvatski Kanal" placeholder="Tekst vodenog žiga" />
        </div>
        <div class="row">
          <button id="applyBtn" class="btn btn-primary" type="button">Dodaj žig</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="tool-box" style="margin-top:16px; display:flex; justify-content:center;">
        <canvas id="canvas" width="700" height="500"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const watermarkText = document.getElementById('watermarkText');
    const applyBtn = document.getElementById('applyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let sourceImage = null;

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    applyBtn.addEventListener('click', () => {
      if (!sourceImage) return;
      canvas.width = sourceImage.width;
      canvas.height = sourceImage.height;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(sourceImage, 0, 0);
      const text = watermarkText.value.trim() || 'Hrvatski Kanal';
      ctx.save();
      ctx.font = '700 ' + Math.max(26, Math.min(80, sourceImage.width / 10)) + 'px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.globalAlpha = 0.45;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.strokeText(text, canvas.width / 2, canvas.height / 2);
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      ctx.restore();
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'vodeni-zig.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
