<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Čitač teksta</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div class="tool-page">
    <div class="tool-topbar">
      <a href="../index.html">← Natrag</a>
      <span>Čitač teksta</span>
    </div>
    <div class="tool-body">
      <h1>Čitač teksta</h1>
      <p>Prebaci tekst u govor direktno u browseru.</p>

      <div class="tool-box">
        <textarea id="textInput" placeholder="Upiši tekst ovdje..."></textarea>
        <div class="row">
          <button id="speakBtn" class="btn btn-primary" type="button">Reci</button>
          <button id="stopBtn" class="btn btn-secondary" type="button">Zaustavi</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const textInput = document.getElementById('textInput');
    const speakBtn = document.getElementById('speakBtn');
    const stopBtn = document.getElementById('stopBtn');

    speakBtn.addEventListener('click', () => {
      const text = textInput.value.trim();
      if (!text) return;
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'hr-HR';
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }
    });

    stopBtn.addEventListener('click', () => {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });
  </script>
</body>
</html>
