<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zamućivanje slike</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .canvas-wrap { display: flex; justify-content: center; margin-top: 18px; overflow-x: auto; }
    canvas { max-width: 100%; border-radius: 16px; }
  </style>
</head>
<body>
    <div class="tool-page">
      <div class="tool-topbar">
        <a href="../index.html">← Natrag</a>
        <span>Zamućivanje slike</span>
      </div>
      <div class="tool-body">
        <h1>Zamućivanje slike</h1>
        <p>Primijeni efekt zamućenja na cijelu sliku.</p>

      <div class="tool-box">
        <label class="btn btn-primary" style="display:inline-flex; width:max-content; cursor:pointer;">
          <input id="fileInput" type="file" accept="image/*" />
          Učitaj sliku
        </label>

        <div class="row">
          <label>Intenzitet zamućenja:</label>
          <div style="width:100%; display:flex; gap:10px; align-items:center;">
            <input id="blurAmount" type="range" min="1" max="50" value="15" style="flex:1;" />
            <span id="blurValue" style="min-width:40px; font-weight:600;">15px</span>
          </div>
        </div>

        <div class="row">
          <button id="applyBtn" class="btn btn-primary" type="button">Primijeni efekt</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button>
        </div>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas" width="700" height="500"></canvas>
      </div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const blurAmount = document.getElementById('blurAmount');
    const blurValue = document.getElementById('blurValue');
    const applyBtn = document.getElementById('applyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let sourceImage = null;

    function fitCanvasToImage(image) {
      const scale = Math.min(1, 700 / image.naturalWidth, 500 / image.naturalHeight);
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    }

    blurAmount.addEventListener('input', () => {
      blurValue.textContent = blurAmount.value + 'px';
    });

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          sourceImage = img;
          fitCanvasToImage(img);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.filter = 'none';
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });

    applyBtn.addEventListener('click', () => {
      if (!sourceImage) return;
      const blur = Number(blurAmount.value);
      fitCanvasToImage(sourceImage);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.filter = `blur(${blur}px)`;
      ctx.drawImage(sourceImage, 0, 0, canvas.width, canvas.height);
      ctx.filter = 'none';
      downloadBtn.disabled = false;
    });

    downloadBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = 'zamucivanje-pozadine.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    });
  </script>
</body>
</html>
