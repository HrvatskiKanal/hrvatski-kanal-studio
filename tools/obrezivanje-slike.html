<!DOCTYPE html>
<html lang="hr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Obrezivanje slike</title><link rel="stylesheet" href="../styles.css"><style>.canvas-wrap{display:flex;justify-content:center;overflow:auto;margin-top:18px}.canvas-wrap canvas{max-width:100%;border-radius:14px}</style></head>
<body><div class="tool-page"><div class="tool-topbar"><a href="../index.html">← Natrag</a><span>Obrezivanje slike</span></div><div class="tool-body"><h1>Obrezivanje slike</h1><p>Izreži sredinu slike prema odabranom omjeru, bez učitavanja na internet.</p><div class="tool-box"><label class="btn btn-primary" style="display:inline-flex;width:max-content;cursor:pointer"><input id="fileInput" type="file" accept="image/*">Učitaj sliku</label><div class="row"><label for="ratio">Omjer:</label><select id="ratio"><option value="free">Slobodno</option><option value="1">1:1</option><option value="1.7778">16:9</option><option value="1.3333">4:3</option><option value="0.8">4:5</option></select></div><div class="row"><button id="cropBtn" class="btn btn-primary" type="button">Obreži</button><button id="downloadBtn" class="btn btn-success" type="button" disabled>Preuzmi</button></div></div><div class="canvas-wrap"><canvas id="canvas"></canvas></div></div></div>
<script>const fileInput=document.getElementById('fileInput'),ratioSelect=document.getElementById('ratio'),cropBtn=document.getElementById('cropBtn'),downloadBtn=document.getElementById('downloadBtn'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let image=null;fileInput.onchange=e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{image=new Image();image.onload=()=>{canvas.width=image.width;canvas.height=image.height;ctx.drawImage(image,0,0)};image.src=ev.target.result};reader.readAsDataURL(file)};cropBtn.onclick=()=>{if(!image)return;let w=image.width,h=image.height;const ratio=ratioSelect.value==='free'?w/h:Number(ratioSelect.value);if(w/h>ratio)w=Math.round(h*ratio);else h=Math.round(w/ratio);const sx=Math.round((image.width-w)/2),sy=Math.round((image.height-h)/2);canvas.width=w;canvas.height=h;ctx.drawImage(image,sx,sy,w,h,0,0,w,h);downloadBtn.disabled=false};downloadBtn.onclick=()=>{const a=document.createElement('a');a.download='obrezana-slika.png';a.href=canvas.toDataURL('image/png');a.click()}</script></body></html>
