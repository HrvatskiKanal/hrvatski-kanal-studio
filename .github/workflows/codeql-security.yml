name: CodeQL sigurnosna analiza

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "tools/**/*.js"
      - "scripts/**/*.py"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/workflows/codeql-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "tools/**/*.js"
      - "scripts/**/*.py"
      - ".github/workflows/**/*.yml"
      - ".github/workflows/**/*.yaml"
      - ".github/workflows/codeql-security.yml"
  schedule:
    - cron: "23 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL — JavaScript, Python i Actions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Preuzmi izvorni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pokreni CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript, python, actions
          queries: security-extended
          build-mode: none
      - name: Analiziraj i objavi rezultate samo u GitHubu
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'always' || 'never' }}
          upload-database: false
